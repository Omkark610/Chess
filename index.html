<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aurum Chess - Luxury Edition</title>

<style>
:root {
  --gold-100: #fff5db;
  --gold-300: #f0c978;
  --gold-400: #d4af37;
  --gold-500: #b8860b;
  --gold-700: #7a5405;
  --bg-dark: #05070a;
  --bg-card: rgba(18, 22, 33, 0.65);
  --glass-border: rgba(212, 175, 55, 0.22);
  --glass-glow: rgba(212, 175, 55, 0.12);
  
  --lt: #f3e9d2;
  --dk: #8c6843;
  --pw: #fffdfa;
  --pb: #16181f;
  --pbs: #d4af37;
  --pws: #4a381c;
  
  --font-serif: 'Playfair Display', Georgia, serif;
  --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

body[data-bt=emerald]{--lt:#e5ebd9;--dk:#3e6e4f}
body[data-bt=slate]{--lt:#d0d7e3;--dk:#4a5970}
body[data-bt=rose]{--lt:#f3e2de;--dk:#8a4d46}

body[data-pt=ivory]{--pw:#fffbf5;--pb:#26180f;--pbs:#ab8552;--pws:#705330}
body[data-pt=neon]{--pw:#8be8ff;--pb:#e29bff;--pbs:#080814;--pws:#080814}

*{box-sizing:border-box;margin:0;padding:0;user-select:none;touch-action:manipulation}[hidden]{display:none!important}

body {
  background: 
    radial-gradient(circle at 10% 10%, rgba(212, 175, 55, 0.08), transparent 40%),
    radial-gradient(circle at 90% 90%, rgba(30, 48, 88, 0.25), transparent 50%),
    radial-gradient(circle at 50% 50%, #0d111a, var(--bg-dark));
  color: #ece8df;
  font-family: var(--font-sans);
  min-height: 100dvh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}

h1,h2,h3,.logo {
  font-family: var(--font-serif);
  letter-spacing: 0.02em;
}

/* Background Animated Auras */
.bg-ambient {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.bg-ambient::before, .bg-ambient::after {
  content: '';
  position: absolute;
  width: 50vmax;
  height: 50vmax;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.12;
  animation: floatOrb 22s ease-in-out infinite alternate;
}
.bg-ambient::before { background: var(--gold-400); top: -15vmax; left: -10vmax; }
.bg-ambient::after { background: #254db0; right: -15vmax; bottom: -15vmax; animation-delay: -11s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(8vmax, 6vmax) scale(1.18); }
}

/* Header Navbar */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  border-bottom: 1px solid var(--glass-border);
  background: rgba(7, 9, 15, 0.85);
  backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 20;
  width: 100%;
}

.logo {
  font-size: clamp(16px, 4.5vw, 22px);
  font-weight: 700;
  color: var(--gold-100);
  display: flex;
  align-items: center;
  gap: 6px;
  text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
  white-space: nowrap;
}
.logo span {
  color: var(--gold-400);
  font-weight: 400;
  font-style: italic;
}

nav { 
  display: flex; 
  gap: 6px; 
  align-items: center; 
  overflow-x: auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }

/* Buttons */
button {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  color: #e5ded0;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

button:hover, button:active {
  background: rgba(212, 175, 55, 0.15);
  border-color: rgba(212, 175, 55, 0.45);
}

button.gold {
  background: linear-gradient(135deg, #f7e6c4 0%, #d4af37 50%, #aa8022 100%);
  color: #0d0a03;
  font-weight: 700;
  border: none;
  box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

/* Hero Screen */
.hero {
  text-align: center;
  padding: 5vh 16px 4vh;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}
.hero h1 {
  font-size: clamp(28px, 7vw, 64px);
  color: var(--gold-100);
  line-height: 1.15;
  margin-bottom: 12px;
  text-shadow: 0 4px 20px rgba(0,0,0,0.8);
}
.hero h1 em {
  font-style: italic;
  background: linear-gradient(135deg, #fff3d1, #d4af37, #99731e);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p {
  font-size: clamp(14px, 3.8vw, 17px);
  opacity: 0.8;
  margin-bottom: 28px;
  font-weight: 300;
  padding: 0 8px;
}

.cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; width: 100%; }
.hc {
  width: min(340px, 100%);
  padding: 24px 20px;
  text-align: left;
  border-radius: 18px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
}
.hc b {
  display: block;
  font-family: var(--font-serif);
  font-size: 20px;
  color: var(--gold-300);
  margin-bottom: 6px;
}
.hc span { opacity: 0.75; font-size: 13px; line-height: 1.4; display: block; }

/* Main Game Layout */
#game {
  display: grid;
  gap: 12px;
  justify-content: center;
  padding: 10px 12px 20px;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  --s: min(calc(100vw - 24px), calc(100dvh - 280px), 640px);
  grid-template-columns: minmax(0, var(--s));
}

@media(min-width: 960px) {
  #game {
    --s: min(calc(100vw - 420px), calc(100dvh - 140px), 720px);
    grid-template-columns: minmax(0, var(--s)) 340px;
    align-items: start;
    padding: 20px;
    gap: 20px;
  }
}

/* Player Info Bar */
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 6px 12px;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  margin: 4px 0;
}
.av {
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #f0c978, #8c6843);
  color: #0f0c06;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.bar > div:nth-child(2) { min-width: 0; flex: 1; }
.nm { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb { font-size: 11px; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caps { font-size: 14px; letter-spacing: -1px; opacity: 0.95; white-space: nowrap; }
.clk {
  margin-left: auto;
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 16px;
  padding: 4px 10px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.05);
  color: #d1c7b7;
}
.bar.act {
  border-color: var(--gold-400);
  box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
  background: rgba(28, 33, 48, 0.85);
}
.bar.act .clk { color: var(--gold-300); border-color: rgba(212, 175, 55, 0.3); }

/* Chess Board */
#board {
  width: var(--s);
  height: var(--s);
  display: grid;
  grid-template: repeat(8, 1fr) / repeat(8, 1fr);
  border: 3px solid var(--gold-400);
  border-radius: 10px;
  overflow: hidden;
  touch-action: none;
  box-shadow: 0 12px 40px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
  user-select: none;
  font-size: calc(var(--s) / 8 * 0.82);
  margin: 0 auto;
}
#board.in { animation: boardIn 0.4s ease-out; }
@keyframes boardIn { from { opacity: 0; transform: scale(0.98); } }
#board.shake { animation: shakeBoard 0.4s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shakeBoard { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }

.sq { position: relative; display: grid; place-items: center; background: var(--lt); cursor: pointer; touch-action: none; }
.sq.d { background: var(--dk); }
.sq i {
  position: absolute;
  font-family: var(--font-sans);
  font-size: clamp(8px, 2vw, 10px);
  font-weight: 600;
  opacity: 0.55;
  font-style: normal;
  pointer-events: none;
  color: #000;
}
.rk { top: 2px; left: 3px; }
.fl { bottom: 1px; right: 3px; }
.sq.d i { color: #fff; }

.lm::before { content: ''; position: absolute; inset: 0; background: rgba(212, 175, 55, 0.35); }
.sel { box-shadow: inset 0 0 0 3px #fff0b3, inset 0 0 16px #ffd700; }
.dot::after { content: ''; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(0, 0, 0, 0.3); }
.cap::after { content: ''; position: absolute; inset: 6%; border-radius: 50%; border: 3px solid rgba(0, 0, 0, 0.35); }
.chk { box-shadow: inset 0 0 20px 6px #ff3344 !important; }
.hint { box-shadow: inset 0 0 0 3px #00d2ff, inset 0 0 14px #00d2ff; }

.p {
  position: relative;
  line-height: 1;
  pointer-events: none;
  -webkit-text-stroke: 1px var(--pws);
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
  transition: transform 0.15s ease;
}
.p.w { color: var(--pw); }
.p.b { color: var(--pb); -webkit-text-stroke: 1px var(--pbs); }
.ghost { position: fixed; pointer-events: none; z-index: 50; transform: translate(-50%, -50%); font-size: calc(var(--s) / 8); }

/* Sidebar Panels */
aside { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.card {
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  padding: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}
.card h3 { font-size: 15px; color: var(--gold-300); margin-bottom: 6px; }

#hist {
  list-style: none;
  padding: 0;
  max-height: 120px;
  overflow-y: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  margin-top: 4px;
}
#hist li { display: grid; grid-template-columns: 32px 1fr 1fr; padding: 3px 6px; border-radius: 4px; }
#hist li:nth-child(odd) { background: rgba(255, 255, 255, 0.02); }
#hist span { opacity: 0.4; }

@media(min-width: 960px) {
  #hist { max-height: calc(var(--s) - 280px); min-height: 140px; }
}

.g2 { 
  display: grid; 
  grid-template-columns: repeat(3, 1fr); 
  gap: 8px; 
}
@media(min-width: 960px) {
  .g2 { grid-template-columns: repeat(2, 1fr); }
}

#stat { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--gold-100); }
.ck { color: #ff6b6b; animation: pulseGlow 1s infinite alternate; }
@keyframes pulseGlow { from { opacity: 0.6; } to { opacity: 1; } }

.spin {
  width: 12px; height: 12px;
  border: 2px solid var(--gold-400);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
  vertical-align: -1px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Modals & Overlays */
#ov {
  position: fixed; inset: 0;
  background: rgba(3, 5, 10, 0.85);
  backdrop-filter: blur(10px);
  display: grid; place-items: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 100;
  padding: 16px;
}
#ov.on { opacity: 1; pointer-events: auto; }

#md {
  background: linear-gradient(165deg, #161b29, #0a0d14);
  border: 1px solid var(--gold-400);
  border-radius: 20px;
  padding: 20px;
  max-width: 440px; width: 100%;
  max-height: 85dvh; overflow-y: auto;
  transform: scale(0.95) translateY(10px);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  display: grid; gap: 12px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
}
#ov.on #md { transform: scale(1) translateY(0); }
#md h2 { color: var(--gold-300); font-size: 20px; text-align: center; }

input, select, textarea {
  font-family: var(--font-sans);
  font-size: 14px; color: #fff;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 10px 12px;
  width: 100%;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--gold-400); outline: none; }
select option { background: #0f121d; color: #fff; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 100px; }
.f { display: grid; gap: 4px; font-size: 12px; opacity: 0.9; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg label { flex: 1; min-width: 70px; }
.seg input { display: none; }
.seg span {
  display: block; text-align: center; padding: 8px 4px;
  border: 1px solid var(--glass-border); border-radius: 10px;
  cursor: pointer; background: rgba(255, 255, 255, 0.03); transition: 0.2s;
  font-size: 13px;
}
.seg input:checked + span {
  background: linear-gradient(135deg, #f7e6c4, #d4af37);
  color: #000; font-weight: 700; border-color: transparent;
}

.big {
  font-family: var(--font-serif);
  font-size: clamp(32px, 8vw, 48px);
  text-align: center;
  background: linear-gradient(#fff5db, #d4af37);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.lose .big { background: linear-gradient(#ffc0c0, #dc2626); -webkit-background-clip: text; background-clip: text; }

.code {
  font-family: var(--font-mono);
  font-size: 28px; font-weight: 700;
  letter-spacing: 0.2em; text-align: center;
  color: var(--gold-300); padding: 10px;
  border: 2px dashed var(--gold-400); border-radius: 12px;
  background: rgba(212, 175, 55, 0.05);
}

#toasts {
  position: fixed; top: 60px; left: 50%;
  transform: translateX(-50%); z-index: 120;
  display: grid; gap: 6px; pointer-events: none;
  width: min(90%, 320px);
}
.toast {
  background: rgba(15, 20, 32, 0.95);
  border: 1px solid var(--gold-400);
  color: var(--gold-100);
  padding: 8px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 500; text-align: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } }
</style>
</head>
<body>
<div class="bg-ambient"></div>
<header>
  <div class="logo">♞ AURUM <span>CHESS</span></div>
  <nav>
    <button id="nH">Home</button>
    <button id="nP">Play</button>
    <button id="nY">History</button>
    <button id="nS">Settings</button>
    <button id="bSnd" aria-label="Toggle sound">🔊</button>
    <button id="bFs" aria-label="Toggle fullscreen">⤢</button>
  </nav>
</header>

<main>
  <section id="home">
    <div class="hero">
      <h1>Play Chess <em>Beautifully</em></h1>
      <p>Challenge an intelligent AI engine or face friends across different mobile devices via Room Code.</p>
      <div class="cards">
        <button class="hc" id="hAI">
          <b>♚ Human vs Engine</b>
          <span>4 difficulty levels · Grandmaster hints · Move undo</span>
        </button>
        <button class="hc" id="hMP">
          <b>♞ Room Code Match</b>
          <span>Instant pairing across different phones using 6-character room codes</span>
        </button>
      </div>
    </div>
  </section>

  <section id="game" hidden>
    <div>
      <div class="bar" id="top">
        <div class="av"></div>
        <div><div class="nm"></div><div class="sb sm"></div></div>
        <div class="caps"></div>
        <div class="clk">--</div>
      </div>
      <div id="board" role="grid" aria-label="Chessboard"></div>
      <div class="bar" id="bot">
        <div class="av"></div>
        <div><div class="nm"></div><div class="sb sm"></div></div>
        <div class="caps"></div>
        <div class="clk">--</div>
      </div>
    </div>
    
    <aside>
      <div class="card">
        <div id="stat"></div>
        <div class="sm" style="opacity:0.75">Last move: <b id="lmv" style="color:var(--gold-300)">—</b></div>
      </div>
      <div class="card">
        <h3>Move Log</h3>
        <ol id="hist"></ol>
      </div>
      <div class="card g2">
        <button id="bHint">💡 Hint</button>
        <button id="bUndo">↶ Undo</button>
        <button id="bDraw">½ Draw</button>
        <button id="bRes">⚑ Resign</button>
        <button id="bNew" class="gold">New Game</button>
        <button id="bMenu">Menu</button>
      </div>
    </aside>
  </section>
</main>

<div id="ov"><div id="md" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<!-- Include chess.js and PeerJS for true cross-device internet multiplayer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';

/* ===== Helpers & settings ===== */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'},V={p:100,n:320,b:330,r:500,q:900,k:0},LV=['Easy','Medium','Hard','Expert'],ELO=[800,1300,1800,2200];
let S={name:'Player',bt:'gold',pt:'champ',snd:1,music:1,mus:.18,sfx:.6};
try{Object.assign(S,JSON.parse(localStorage.getItem('aurumSettings')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('aurumSettings',JSON.stringify(S))}catch(e){}};

function toast(t){
  const e=document.createElement('div');
  e.className='toast';
  e.textContent=t;
  $('#toasts').append(e);
  setTimeout(()=>e.remove(),2800);
}

function copy(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied to clipboard!'),()=>{
    const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();
    try{document.execCommand('copy');toast('Copied!')}catch(e){toast('Copy failed')}a.remove();
  });
}

/* ===== Web Audio Synthesizer ===== */
let AC,mg,sg,mT;
function aud(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();sg=AC.createGain();mg.connect(AC.destination);sg.connect(AC.destination)}if(AC.state=='suspended')AC.resume();vol()}catch(e){}}
function vol(){if(!AC)return;mg.gain.value=S.snd&&S.music?S.mus:0;sg.gain.value=S.snd?S.sfx:0}
function tone(f,t,d,ty,v,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest||sg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v){const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1600;s.buffer=b;g.gain.value=v;s.connect(f);f.connect(g);g.connect(sg);s.start(t)}
const arp=(a,t,d,ty,v,st)=>a.forEach((f,i)=>tone(f,t+i*(st||.1),d,ty,v));
const SFX={move:t=>{noise(t,.08,.6);tone(170,t,.08,'triangle',.3)},cap:t=>{noise(t,.16,1);tone(110,t,.16,'square',.15)},check:t=>arp([880,660],t,.2,'square',.12,.12),
castle:t=>{SFX.move(t);SFX.move(t+.13)},promo:t=>arp([523,659,784,1047],t,.3,'triangle',.25,.07),start:t=>arp([392,523,659],t,.4,'sine',.25),
win:t=>arp([523,659,784,1047,1319],t,.5,'triangle',.3,.12),lose:t=>arp([392,330,262,196],t,.6,'sine',.3,.18),draw:t=>arp([440,392,440],t,.4,'sine',.25,.2),join:t=>arp([660,880],t,.25,'sine',.25,.12)};

 const play=()=>{const c=ch[i++%4],t=AC.currentTime+.05;c.forEach((f,k)=>tone(f,t+k*.35,2.8,'triangle',.22,mg));[c[2],c[1],c[3],c[1]].forEach((f,k)=>tone(f,t+1.5+k*.4,2.4,'triangle',.16,mg));tone(c[0]/2,t,3.2,'sine',.3,mg)};play();mT=setInterval(play,3200)}

function render(fr){
  const fq=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.sq,fs='abcdefgh',flip=me=='b';let ks=null;
  if(ch.in_check())ch.board().forEach((r,y)=>r.forEach((p,x)=>{if(p&&p.type=='k'&&p.color==ch.turn())ks=fs[x]+(8-y)}));
  let h='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const sq=flip?fs[7-c]+(r+1):fs[c]+(8-r),p=ch.get(sq);
    const cl='sq '+((r+c)%2?'d':'l')+(sel==sq?' sel':'')+(lm&&(lm.from==sq||lm.to==sq)?' lm':'')+(legal.includes(sq)?(p?' cap':' dot'):'')+(ks==sq?' chk':'')+(hint&&(hint.from==sq||hint.to==sq)?' hint':'');
    h+=`<div class="${cl}" data-sq="${sq}" tabindex="0" role="gridcell" aria-label="${sq}${p?' '+(p.color=='w'?'white ':'black ')+p.type:''}">${p?`<span class="p ${p.color}">${GL[p.type]}&#xFE0E;</span>`:''}${c==0?`<i class=rk>${sq[1]}</i>`:''}${r==7?`<i class=fl>${sq[0]}</i>`:''}</div>`

      el.style.transform='';

  hv.forEach(m=>m.captured&&caps[m.color].push(m.captured));

function clocks(){const opp=me=='w'?'b':'w';$('#top .clk').textContent=fmt(clk[opp]);$('#bot .clk').textContent=fmt(clk[me])}
setInterval(()=>{const n=Date.now(),d=n-tl;tl=n;if(over||!started||!tc||!ch.history().length)return;const t=ch.turn();clk[t]-=d;if(clk[t]<=0){clk[t]=0;clocks();end(t=='w'?'b':'w','Time out');return}clocks()},200);

function end(res,why){
  if(over)return;over=true;think=false;const d=res=='d',win=res==me;
  resText=(d?'Draw':(res=='w'?'White':'Black')+' wins')+' — '+why;
  sfx(d?'draw':win?'win':'lose');render();ui();
  try{
    const a=JSON.parse(localStorage.getItem('aurumHist')||'[]');
    a.unshift({t:new Date().toLocaleString(),m:mode=='ai'?'vs AI '+LV[lvl]:'Online Room',r:resText,n:ch.history().length});
    localStorage.setItem('aurumHist',JSON.stringify(a.slice(0,30)));
  }catch(e){}
  
  setTimeout(()=>{
    if(!over)return;const t=d?'Draw':win?'Victory':'Defeat';
    M(`<div class="${t=='Defeat'?'lose':''}"><div class=big>${t}</div></div><p style="text-align:center;margin:10px 0;opacity:0.8">${esc(why)}</p><div class=row><button class=gold id=rA>${mode=='net'?'Rematch':'Play again'}</button><button id=rV>View board</button><button id=rM>Menu</button></div><p id=rN class=sm style="text-align:center"></p>`);
    $('#rA').onclick=()=>mode=='net'?rematch():newGame();$('#rV').onclick=closeM;$('#rM').onclick=leaveGame;
  },800);
}

function after(m){
  const e=B.querySelector(`[data-sq=${m.from}]`),fr=e&&e.getBoundingClientRect();lm=m;sel=null;legal=[];hint=null;tl=Date.now();
  const chk=ch.in_check(),mate=ch.in_checkmate();
  sfx(chk||mate?'check':m.promotion?'promo':m.captured?'cap':/[kq]/.test(m.flags)?'castle':'move');render(fr);ui();
  if(mate)return end(m.color,'Checkmate');if(ch.in_stalemate())return end('d','Stalemate');if(ch.insufficient_material())return end('d','Insufficient material');
  if(ch.in_threefold_repetition())return end('d','Threefold repetition');if(ch.in_draw())return end('d','Fifty-move rule');
  if(chk){toast('Check!');B.classList.add('shake');setTimeout(()=>B.classList.remove('shake'),400)}
  if(mode=='ai'&&ch.turn()!=me)setTimeout(aiMove,250);
}

function play(from,to,pr){if(over||ch.turn()!=me)return;const m=ch.move({from,to,promotion:pr});if(!m)return;if(mode=='net')send({t:'move',from,to,promo:pr});after(m)}
function tryMove(from,to){
  const c=ch.moves({square:from,verbose:true}).filter(m=>m.to==to);if(!c.length){sel=null;legal=[];render();return}
  if(c[0].promotion){
    M(`<h2>Pawn Promotion</h2><div class=row>${['q','r','b','n'].map(p=>`<button data-p=${p} style="font-size:32px">${GL[p]}&#xFE0E;</span></button>`).join('')}</div>`);
    document.querySelectorAll('#md [data-p]').forEach(b=>b.onclick=()=>{closeM();play(from,to,b.dataset.p)});
  }else play(from,to,undefined);
}

function press(sq){
  if(over||think||ch.turn()!=me)return false;
  if(sel&&legal.includes(sq)){tryMove(sel,sq);return false}
  const p=ch.get(sq);
  if(p&&p.color==me){sel=sq;legal=ch.moves({square:sq,verbose:true}).map(m=>m.to);hint=null;render();return true}
  sel=null;legal=[];render();return false;
}

B.addEventListener('pointerdown',e=>{const q=e.target.closest('.sq');if(!q)return;const sq=q.dataset.sq;if(press(sq))drag={sq,x:e.clientX,y:e.clientY,on:false,g:null}});

    const el=B.querySelector(`[data-sq=${drag.sq}] .p`);if(!el)return drag=null;
    drag.on=true;const g=el.cloneNode(true);g.className='p ghost '+el.className.slice(2);
    document.body.append(g);drag.g=g;el.style.opacity=.2;
  }
  if(drag&&drag.on){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px'}

/* ===== AI Engine Search ===== */
let dl=0,nn=0;
function ev(){let s=0;ch.board().forEach((row,r)=>row.forEach((p,c)=>{if(!p)return;const ce=3.5-Math.max(Math.abs(r-3.5),Math.abs(c-3.5));let b=0;
 if(p.type=='p')b=ce*4+(p.color=='w'?6-r:r-1)*6;else if(p.type=='n'||p.type=='b')b=ce*9;else if(p.type=='q')b=ce*2;else if(p.type=='k')b=-ce*8;
 s+=(p.color=='w'?1:-1)*(V[p.type]+b)}));return s}
const osc=m=>(m.captured?10*V[m.captured]-V[m.piece]:0)+(m.promotion?800:0),ord=a=>a.sort((x,y)=>osc(y)-osc(x)),mv=m=>({from:m.from,to:m.to,promotion:m.promotion});
function nega(d,a,b){if((++nn&255)==0&&Date.now()>dl)throw'T';if(d==0)return(ch.turn()=='w'?1:-1)*ev();
 const ms=ch.moves({verbose:true});if(!ms.length)return ch.in_check()?-99000-d:0;ord(ms);let best=-1e9;
 for(const m of ms){ch.move(mv(m));let s;try{s=-nega(d-1,-b,-a)}finally{ch.undo()}if(s>best)best=s;if(s>a)a=s;if(a>=b)break}return best}
function search(maxD,ms){dl=Date.now()+ms;nn=0;let list=ord(ch.moves({verbose:true})),best=list[0];
 for(let d=1;d<=maxD;d++){let bm=null,bs=-1e9;try{for(const m of list){ch.move(mv(m));let s;try{s=-nega(d-1,-1e9,-bs)}finally{ch.undo()}if(s>bs||!bm){bs=s;bm=m}}}catch(e){if(e!=='T')throw e;break}
  best=bm;list=[bm,...list.filter(x=>x!==bm)]}return best}
function aiMove(){if(over||mode!='ai'||ch.turn()==me||think)return;think=true;ui();
 setTimeout(()=>{let m,all=ch.moves({verbose:true});try{m=lvl==0&&Math.random()<.4?all[Math.random()*all.length|0]:search([1,2,3,6][lvl],[300,900,1800,3000][lvl])}catch(e){m=all[0]}
  think=false;if(over||!m)return;let r=ch.move(mv(m));if(!r)r=ch.move(mv(all[0]));if(r)after(r)},60)}

/* ===== Cross-Device PeerJS Multiplayer ===== */
const nm=s=>String(s||'Opponent').slice(0,16);
let peer=null,conn=null;

function netClose(){
  if(conn){try{conn.close()}catch(e){}}
  if(peer){try{peer.destroy()}catch(e){}}
  conn=null;peer=null;N=null;
}

function send(m){if(conn&&conn.open)conn.send(m)}

function startNet(role, opponentName, assignedColor){
  mode='net';
  oppName=opponentName;
  me=assignedColor;
  N={conn:true};
  newGame();
  sfx('join');
  toast(oppName+' connected!');
}

function onNetMessage(m){
  if(!m||typeof m.t!='string')return;
  switch(m.t){
    case'join':
      // Host receives join request from guest
      if(N.role!='host'||N.conn)return;
      N.conn=true;
      oppName=nm(m.name);
      me=Math.random()<.5?'w':'b';
      const assignedColor=(me=='w'?'b':'w');
      send({t:'welcome',color:assignedColor,tc,name:S.name});
      startNet('host',oppName,me);
      break;
    case'welcome':
      // Guest receives welcome from host
      if(N.role!='guest'||N.conn||(m.color!='w'&&m.color!='b'))return;
      N.conn=true;
      me=m.color;
      tc=[0,1,3,5,10,15,30].includes(+m.tc)?+m.tc:10;
      startNet('guest',oppName,me);
      break;
    case'move':
      if(!N.conn||over||ch.turn()==me||!/^[a-h][1-8]$/.test(m.from)||!/^[a-h][1-8]$/.test(m.to)||(m.promo&&!/^[qrbn]$/.test(m.promo)))return;
      {const r=ch.move({from:m.from,to:m.to,promotion:m.promo||undefined});if(r)after(r);else toast('Invalid move rejected')}
      break;
    case'resign':
      if(!over&&N.conn)end(me,'Opponent resigned');
      break;
    case'draw':
      if(!over&&N.conn)ask('Draw Offer','Your opponent offers a draw. Accept?',()=>{send({t:'drawA'});end('d','Draw agreed')},()=>send({t:'drawD'}));
      break;
    case'drawA':end('d','Draw agreed');break;
    case'drawD':toast('Draw offer declined');break;
    case'rematch':
      N.theirR=1;
      if(N.myR)doRematch();
      else{toast('Opponent wants a rematch');const e=$('#rN');if(e)e.textContent='Opponent requested a rematch!'}
      break;
    case'bye':
      peerGone();
      break;
  }
}

function peerGone(){
  if(!N||!N.conn)return;N.conn=false;if(over){toast('Opponent disconnected');return}
  over=true;think=false;resText='Opponent left';sfx('lose');render();ui();toast('Opponent disconnected');
  M(`<h2>Disconnected</h2><p style="text-align:center;margin:10px 0;opacity:0.8">The connection was interrupted.</p><div class=row><button class=gold id=dM>Back to Menu</button><button id=dV>View Board</button></div>`);
  $('#dM').onclick=leaveGame;$('#dV').onclick=closeM;
}

function rematch(){if(!N||!N.conn)return toast('Opponent not connected');N.myR=1;send({t:'rematch'});toast('Rematch requested');const e=$('#rN');if(e)e.textContent='Waiting for opponent...';if(N.theirR)doRematch()}
function doRematch(){N.myR=N.theirR=0;me=me=='w'?'b':'w';newGame()}
function leaveGame(){netClose();over=true;started=false;closeM();show('home')}

const mSt=t=>{const e=$('#mSt');if(e)e.textContent=t};

function mpModal(){
  M(`<h2>Online Matchmaking</h2><p class=sm style="text-align:center;opacity:0.8">Play with a friend on a different mobile device using a room code.</p>
  <label class=f>Time Control (Host)${tcSel('mTc',10)}</label>
  <div class=row><button class=gold id=mCreate>Create Room</button></div>
  <div id=mWait hidden><div class=code id=rc></div><p class=sm style="text-align:center;margin:8px 0"><span class=spin></span> Waiting for opponent...</p><div class=row><button id=mCopy>Copy Code</button><button id=mLeave>Cancel</button></div></div>
  <div class=row style="margin-top:8px"><input id=mCode maxlength=6 placeholder="ENTER CODE" aria-label="Room code" style="text-transform:uppercase;text-align:center;font-weight:700;letter-spacing:2px"><button id=mJoin>Join Room</button></div>
  <p id=mSt class=sm style="text-align:center;color:var(--gold-300)"></p>`);

  $('#mCreate').onclick=()=>{
    tc=+$('#mTc').value;
    netClose();
    // Generate a clean 6-character alphanumeric room code
    const c=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');
    
    mSt('Creating room...');
    // Prefix ID to avoid collisions on public PeerJS server
    peer=new Peer('aurum-'+c);
    
    peer.on('open',()=>{
      N={role:'host',conn:false,myR:0,theirR:0};
      $('#mWait').hidden=false;
      $('#rc').textContent=c;
      mSt('Room ready! Share this code with your friend.');
    });

    peer.on('connection', cObj=>{
      conn=cObj;
      conn.on('data',d=>onNetMessage(d));
      conn.on('close',()=>peerGone());
    });

    peer.on('error',err=>{
      mSt('Error creating room. Try another code or check connection.');
    });
  };

  $('#mCopy').onclick=()=>copy($('#rc').textContent);

  $('#mLeave').onclick=()=>{
    netClose();
    $('#mWait').hidden=true;
    mSt('Room cancelled.');
  };

  $('#mJoin').onclick=()=>{
    const c=$('#mCode').value.trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(c))return mSt('Enter a valid 6-character code.');
    netClose();
    mSt('Connecting to room '+c+'...');

    // Guest creates random peer ID and connects to host's peer ID
    peer=new Peer();

    peer.on('open',id=>{
      conn=peer.connect('aurum-'+c);
      
      conn.on('open',()=>{
        N={role:'guest',conn:false,myR:0,theirR:0};
        oppName='Host';
        // Send join handshake
        conn.send({t:'join',name:S.name});
      });

      conn.on('data',d=>onNetMessage(d));
      conn.on('close',()=>peerGone());
    });

    peer.on('error',err=>{
      mSt('Could not connect. Check room code or ensure host is waiting.');
    });
  };
}

  <label class=f>Player Name<input id=sN maxlength=16 value="${esc(S.name)}"></label>
  <label class=f>Board Style<select id=sB>${o([['gold','Classic Gold'],['emerald','Emerald'],['slate','Slate'],['rose','Rosewood']],S.bt)}</select></label>
  <label class=f>Piece Palette<select id=sP>${o([['champ','Champagne & Onyx'],['ivory','Ivory & Ebony'],['neon','Neon Glow']],S.pt)}</select></label>
  <div class=row><label><input type=checkbox id=sS style="width:auto" ${S.snd?'checked':''}> Sound Effects</label><label><input type=checkbox id=sM style="width:auto" ${S.music?'checked':''}> Ambient Music</label></div>
  <label class=f>Music Volume<input type=range id=sMv min=0 max=.5 step=.01 value=${S.mus}></label>
  <label class=f>Effects Volume<input type=range id=sEv min=0 max=1 step=.01 value=${S.sfx}></label>`);
  const up=()=>{S.name=$('#sN').value.trim()||'Player';S.bt=$('#sB').value;S.pt=$('#sP').value;S.snd=$('#sS').checked?1:0;S.music=$('#sM').checked?1:0;S.mus=+$('#sMv').value;S.sfx=+$('#sEv').value;save();applyS();if(S.snd){aud();music()}if(started)ui()};
  document.querySelectorAll('#md input,#md select').forEach(e=>e.oninput=up);
}

function history(){
  let a=[];try{a=JSON.parse(localStorage.getItem('aurumHist')||'[]')}catch(e){}
  M(`<h2>Match History</h2>${a.length?a.map(g=>`<div class=card style="margin-bottom:8px"><b>${esc(g.r)}</b><div class=sm style="opacity:0.7">${esc(g.m)} · ${g.n} moves · ${esc(g.t)}</div></div>`).join(''):'<p class=sm style="text-align:center;opacity:0.7">No matches recorded yet.</p>'}`);
}

const goHome=()=>started&&!over?ask('Abandon Game?','Your current match progress will be lost.',leaveGame):leaveGame();

$('#nH').onclick=goHome;$('#nP').onclick=setupAI;$('#nY').onclick=history;$('#nS').onclick=settings;
$('#hAI').onclick=setupAI;$('#hMP').onclick=mpModal;$('#bMenu').onclick=goHome;
$('#bSnd').onclick=()=>{S.snd=S.snd?0:1;save();applyS();if(S.snd){aud();music()}};
$('#bFs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast('Fullscreen unavailable'));
document.addEventListener('fullscreenchange',()=>$('#bFs').textContent=document.fullscreenElement?'⤡':'⤢');

$('#bNew').onclick=()=>ask('New Game','Start a fresh match?',()=>mode=='net'?(over?rematch():toast('Resign or conclude game first')):newGame());
$('#bRes').onclick=()=>over?0:ask('Resign Game','Are you sure you want to resign?',()=>{if(mode=='net')send({t:'resign'});end(me=='w'?'b':'w','You resigned')});
$('#bDraw').onclick=()=>{if(over)return;if(mode=='net'){send({t:'draw'});return toast('Draw offer sent')}
 const aiC=me=='w'?'b':'w';(aiC=='w'?1:-1)*ev()<=60&&ch.history().length>20?end('d','Draw agreed'):toast('Engine declined draw')};
$('#bUndo').onclick=()=>{if(over||think||mode!='ai'||!ch.history().length)return;ch.undo();if(ch.turn()!=me)ch.undo();const h=ch.history({verbose:true});lm=h[h.length-1]||null;sel=null;legal=[];hint=null;render();ui();if(ch.turn()!=me)setTimeout(aiMove,300)};
$('#bHint').onclick=()=>{if(over||think||mode!='ai'||ch.turn()!=me)return;think=true;ui();setTimeout(()=>{const m=search(3,1500);think=false;hint=m;render();ui()},50)};

addEventListener('pagehide',()=>{if(N)send({t:'bye'})});
applyS();
show('home');
</script>
</body>
</html>
